name: Import matches

on:
    schedule:
        - cron: "0 3 * * *" # daily at 03:00 UTC (06:00 Romania)
    workflow_dispatch:

jobs:
    import:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: data-import
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: pip
                cache-dependency-path: data-import/requirements.txt
            
            - name: Install dependencies
              run: pip install -r requirements.txt
            
            - name: Import upcoming matches
              run: python import_matches.py
              env:
                DATABASE_URL: ${{ secrets.DATABASE_URL }}
                GOALAPI_KEY: ${{ secrets.GOALAPI_KEY }}