name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend/ScoreSeer.Api
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                dotnet-version: "9.0.x"
            
            - name: Build backend
              run: dotnet build -c Release
    
    frontend: 
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with: 
                node-version: "22"
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Type-check and build frontend
              run: npm run build
    
    data-import:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: data-import
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: "pip"
                cache-dependency-path: data-import/requirements-dev.txt
            
            - name: Install dependencies
              run: pip install -r requirements-dev.txt
            
            - name: Run tests
              run: python -m pytest

